services:
  - type: web
    name: rayyanai-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run prisma:generate --workspace backend
    startCommand: npm run prisma:deploy --workspace backend && npm run start --workspace backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: rayyanai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: rayyanai-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_GEMINI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        value: sunnatilla-memory
      - key: PINECONE_REGION
        value: us-east-1
      - key: CLERK_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: static
    name: rayyanai-frontend
    buildCommand: npm install && npm run build --workspace frontend
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_URL
        sync: false

  - type: keyvalue
    name: rayyanai-redis
    plan: starter
    region: oregon
    ipAllowList: []

databases:
  - name: rayyanai-db
    plan: starter
    region: oregon
