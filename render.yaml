services:
  - type: web
    name: pai-app
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_GEMINI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        value: sunnatilla-memory
      - key: PINECONE_REGION
        value: us-east-1
      - key: FRONTEND_URL
        sync: false
      - key: SINGLE_USER_EMAIL
        value: owner@pai.local
      - key: SINGLE_USER_NAME
        value: Rayyan
      - key: SINGLE_USER_ASSISTANT_NAME
        value: Sunnatilla AI
